foreground         #ff00ff
background         #05001a
background_opacity 0.2
background_image   ./kitty-bg2.png
background_image_layout clamped
background_tint    0.9

font_size          17.0
font_family        family="JetBrainsMono Nerd Font"

# --- Vivid Neon ANSI Colors (High Saturation) ---

# Black / Dark Grey
color0 #150033
color8 #4d0099

# Red (Hot Pink)
color1 #ff00ff
color9 #ff55ff

# Green (Electric Lime)
color2 #00ff66
color10 #33ff99

# Yellow (Laser Yellow)
color3 #ffff00
color11 #ffff66

# Blue (Intense Violet)
color4 #9933ff
color12 #b366ff

# Magenta (Shocking Bubblegum)
color5 #ff007f
color13 #ff3399

# Cyan (Electric Cyan)
color6 #00ffff
color14 #66ffff

# White (Pure Blinding White)
color7 #ffffff
color15 #ffffff

# --- Cursor & Tab Bar Styles ---
cursor                 #ff007f
cursor_text_color      #05001a
cursor_shape           underline 
cursor_blink_interval  0.3
cursor_trail           50
cursor_trail_decay     0.1 0.4
shell_integration      no-cursor

tab_bar_style           powerline
tab_powerline_style     round
active_tab_foreground   #05001a
active_tab_background   #ff007f
active_tab_font_style   bold
inactive_tab_foreground #ffffff
inactive_tab_background #150033

# --- Text Marker Highlighting ---
selection_foreground    #05001a
selection_background    #00ffff
url_color               #ff007f
url_style               curly
mark1_foreground        #05001a
mark1_background        #ff00ff
